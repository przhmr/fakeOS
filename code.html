<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMON - MDR Terminal Access</title>
    <style>
        /* --- ESTILOS GLOBALES Y TEMA SEVERANCE --- */
        :root {
            --bg-color: #0A192F;
            --primary-text-color: #64FFDA;
            --secondary-text-color: #CCD6F6;
            --border-color: #1E3A5F;
            --window-bg: #0F2540;
            --title-bar-bg: #1E3A5F;
            --button-bg: #1E3A5F;
            --button-hover-bg: #2A4F75;
            --font-family: 'Consolas', 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
            --mdr-bin-wo: #FF6B6B;
            --mdr-bin-fr: #FFD93D;
            --mdr-bin-dr: #6B7AFF;
            --mdr-bin-ma: #4CAF50;
            --mdr-cell-hover-glow: rgba(100, 255, 218, 0.15);
        }

        body { margin: 0; overflow: hidden; font-family: var(--font-family); user-select: none; background-color: var(--bg-color); color: var(--secondary-text-color); }
        #lumon-os-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; }
        #desktop { flex-grow: 1; background-color: var(--bg-color); position: relative; padding: 15px; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; border: 1px solid var(--border-color); box-sizing: border-box; }
        .desktop-icon { display: flex; flex-direction: column; align-items: center; text-align: center; color: var(--secondary-text-color); margin: 10px; padding: 8px; width: 90px; cursor: pointer; border: 1px solid transparent; transition: background-color 0.2s, border-color 0.2s; }
        .desktop-icon:hover { background-color: rgba(100, 255, 218, 0.1); border: 1px solid var(--primary-text-color); }
        .desktop-icon .icon-placeholder { font-size: 36px; color: var(--primary-text-color); margin-bottom: 5px; }
        .desktop-icon span { font-size: 12px; word-break: break-word; }
        #system-bar { height: 35px; background-color: var(--title-bar-bg); border-top: 1px solid var(--primary-text-color); display: flex; align-items: center; padding: 0 10px; position: relative; z-index: 10000; }
        #system-access-button { background-color: var(--primary-text-color); color: var(--bg-color); border: none; padding: 5px 15px; font-weight: bold; font-size: 14px; cursor: pointer; margin-right: 10px; text-transform: uppercase; }
        #system-access-button:hover { opacity: 0.8; }
        #active-tasks-bar { display: flex; flex-grow: 1; height: 100%; overflow: hidden; }
        .task-button { background-color: var(--button-bg); border: 1px solid var(--border-color); color: var(--secondary-text-color); padding: 4px 10px; margin: 3px; font-size: 13px; cursor: pointer; max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background-color 0.2s; display: flex; align-items: center; }
        .task-button:hover { background-color: var(--button-hover-bg); }
        .task-button.active { background-color: var(--primary-text-color); color: var(--bg-color); font-weight: bold; }
        .task-button .icon-placeholder-small { margin-right: 5px; font-size: 14px; color: var(--primary-text-color); }
        .task-button.active .icon-placeholder-small { color: var(--bg-color); }
        #system-info-area { padding: 0 10px; color: var(--primary-text-color); font-size: 13px; display: flex; align-items: center; height: 100%; }
        #system-access-menu { position: absolute; bottom: 35px; left: 0; width: 280px; background-color: var(--window-bg); border: 1px solid var(--primary-text-color); border-bottom: none; color: var(--secondary-text-color); display: none; flex-direction: column; box-shadow: 5px -5px 0px 0px rgba(100,255,218,0.2); z-index: 9999; }
        #system-access-menu.visible { display: flex; }
        .access-menu-header { background-color: var(--title-bar-bg); padding: 10px 15px; font-weight: bold; font-size: 16px; color: var(--primary-text-color); border-bottom: 1px solid var(--primary-text-color); text-align: center; }
        .access-menu-list { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .access-menu-list li { padding: 10px 20px; cursor: pointer; display: flex; align-items: center; border-bottom: 1px solid var(--border-color); transition: background-color 0.2s; }
        .access-menu-list li:last-child { border-bottom: none; }
        .access-menu-list li:hover { background-color: var(--button-hover-bg); color: var(--primary-text-color); }
        .access-menu-list li .icon-placeholder-small { margin-right: 12px; font-size: 18px; color: var(--primary-text-color); }
        .access-menu-footer { padding: 10px; text-align: right; background-color: var(--title-bar-bg); border-top: 1px solid var(--primary-text-color); }
        .access-menu-footer button { background-color: var(--button-bg); color: var(--secondary-text-color); border: 1px solid var(--primary-text-color); padding: 5px 10px; font-size: 12px; cursor: pointer; }
        .access-menu-footer button:hover { background-color: var(--primary-text-color); color: var(--bg-color); }
        .app-window { position: absolute; min-width: 250px; min-height: 200px; background-color: var(--window-bg); border: 1px solid var(--primary-text-color); box-shadow: 3px 3px 0px 0px rgba(100,255,218,0.3); display: flex; flex-direction: column; overflow: hidden; }
        .app-window.inactive { border-color: var(--border-color); box-shadow: 3px 3px 0px 0px rgba(100,255,218,0.1); }
        .app-window.inactive .title-bar { background: var(--border-color); }
        .app-window.inactive .title-bar-text { color: #8892B0; }
        .title-bar { height: 30px; background: var(--title-bar-bg); color: var(--primary-text-color); display: flex; align-items: center; padding-left: 10px; cursor: grab; border-bottom: 1px solid var(--primary-text-color); }
        .title-bar:active { cursor: grabbing; }
        .title-bar-icon { margin-right: 8px; font-size: 16px; }
        .title-bar-text { flex-grow: 1; font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .title-bar-controls button { width: 25px; height: 25px; background-color: transparent; border: 1px solid transparent; margin-left: 3px; font-family: var(--font-family); font-size: 16px; line-height: 25px; cursor: pointer; color: var(--primary-text-color); display: flex; align-items: center; justify-content: center; }
        .title-bar-controls button:hover { background-color: var(--button-hover-bg); border-color: var(--primary-text-color); }
        .title-bar-controls button.close-button:hover { background-color: #FF6666; color: var(--bg-color); }
        .window-body { flex-grow: 1; padding: 10px; overflow: auto; background-color: var(--window-bg); display: flex; flex-direction: column; }
        
        .terminal-textarea { width: 100%; height: 100%; border: none; resize: none; font-family: var(--font-family); font-size: 14px; background-color: var(--bg-color); color: var(--primary-text-color); box-sizing: border-box; padding: 5px; line-height: 1.4; flex-grow: 1; }
        .terminal-textarea:focus { outline: 1px solid var(--primary-text-color); }
        .snake-game-container { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px; background-color: var(--bg-color); flex-grow: 1; justify-content: center; }
        /* #snakeCanvas { border: 2px solid var(--primary-text-color); background-color: #081424; } */ /* ID no es necesario si se pasa la ref */
        .snake-controls p { margin: 5px 0; font-size: 14px; color: var(--secondary-text-color); }
        .snake-controls button { background-color: var(--button-bg); color: var(--primary-text-color); border: 1px solid var(--primary-text-color); padding: 5px 10px; cursor: pointer; }
        .snake-controls button:hover { background-color: var(--button-hover-bg); }
        .solitaire-container { display: flex; flex-direction: column; align-items: center; padding: 5px; background-color: #081424; height: 100%; box-sizing: border-box; flex-grow: 1; overflow-y: auto; }
        .solitaire-top-area, .solitaire-tableau-area { display: flex; justify-content: space-around; width: 100%; margin-bottom: 10px; flex-wrap: wrap; }
        .solitaire-pile { width: 72px; height: 102px; border: 1px dashed var(--border-color); margin: 2px; position: relative; background-color: rgba(100,255,218,0.05); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--border-color); }
        .solitaire-tableau-pile { height: auto; min-height: 102px; }
        .solitaire-card { width: 70px; height: 100px; border: 1px solid var(--primary-text-color); background-color: var(--secondary-text-color); color: var(--bg-color); font-size: 20px; font-weight: bold; display: flex; flex-direction: column; justify-content: space-between; align-items: center; box-sizing: border-box; padding: 5px; position: absolute; cursor: grab; user-select: none; transition: transform 0.1s ease-out, box-shadow 0.1s ease-out; }
        .solitaire-card.red { color: #FF5555; }
        .solitaire-card .rank-topleft, .solitaire-card .rank-bottomright { font-size: 16px; position: absolute; }
        .solitaire-card .rank-topleft { top: 5px; left: 5px; }
        .solitaire-card .rank-bottomright { bottom: 5px; right: 5px; transform: rotate(180deg); }
        .solitaire-card .suit-center { font-size: 30px; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
        .solitaire-card.facedown { background-image: repeating-linear-gradient( 45deg, var(--border-color), var(--border-color) 5px, var(--window-bg) 5px, var(--window-bg) 10px ); color: transparent; border-color: var(--border-color); }
        .solitaire-card.facedown .rank-topleft, .solitaire-card.facedown .rank-bottomright, .solitaire-card.facedown .suit-center { display: none; }
        .solitaire-card.dragging { opacity: 0.8; z-index: 15000 !important; transform: scale(1.05); box-shadow: 0 0 10px var(--primary-text-color); cursor: grabbing; }
        .solitaire-controls { margin-top: auto; padding-top: 10px; width: 100%; text-align: center; }
        .solitaire-controls button { background-color: var(--button-bg); color: var(--primary-text-color); border: 1px solid var(--primary-text-color); padding: 8px 15px; cursor: pointer; margin: 0 5px; }
        .solitaire-controls button:hover { background-color: var(--button-hover-bg); }
        .voice-recorder-app { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; padding: 20px; text-align: center; flex-grow: 1; }
        .voice-recorder-app button { background-color: var(--button-bg); color: var(--primary-text-color); border: 1px solid var(--primary-text-color); padding: 10px 20px; font-size: 16px; cursor: pointer; min-width: 150px; }
        .voice-recorder-app button:hover { background-color: var(--button-hover-bg); }
        .voice-recorder-app button:disabled { opacity: 0.5; cursor: not-allowed; background-color: var(--border-color); color: var(--secondary-text-color); }
        #recordStatus { color: var(--secondary-text-color); font-style: italic; height: 20px; }
        #audioPlayback { margin-top: 15px; width: 100%; max-width: 300px; }
        #audioPlayback::-webkit-media-controls-panel { background-color: var(--button-bg); border-radius: 0; filter: brightness(1.2); }
        #audioPlayback::-webkit-media-controls-play-button, #audioPlayback::-webkit-media-controls-timeline, #audioPlayback::-webkit-media-controls-current-time-display, #audioPlayback::-webkit-media-controls-time-remaining-display, #audioPlayback::-webkit-media-controls-mute-button, #audioPlayback::-webkit-media-controls-volume-slider { filter: invert(1) hue-rotate(180deg) contrast(0.8); }
        
        .mdr-game-container { display: flex; flex-direction: column; height: 100%; background-color: var(--bg-color); padding: 5px; box-sizing: border-box; }
        .mdr-grid-area { flex-grow: 1; display: grid; gap: 2px; background-color: var(--border-color); border: 1px solid var(--border-color); overflow: auto; position: relative; padding: 2px; }
        .mdr-cell { background-color: var(--window-bg); color: var(--secondary-text-color); display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; transition: background-color 0.1s, box-shadow 0.1s, transform 0.2s ease-out; position: relative; transform-origin: center center; }
        .mdr-cell-content { display: inline-block; transition: transform 0.2s ease-out; transform-origin: center center; padding: 2px; }
        .mdr-cell:not(.processed):not(.selected).hover-effect .mdr-cell-content { transform: scale(1.8); color: var(--primary-text-color); font-weight: bold; }
        .mdr-cell:not(.processed):not(.selected).neighbor-hover-effect .mdr-cell-content { transform: scale(1.3); color: var(--secondary-text-color); }
        .mdr-cell:not(.processed):not(.selected):hover { background-color: var(--mdr-cell-hover-glow); z-index: 2; }
        .mdr-cell.selected .mdr-cell-content { transform: scale(1.2); color: var(--primary-text-color); }
        .mdr-cell.selected { background-color: rgba(100, 255, 218, 0.4); outline: 1px solid var(--primary-text-color); box-shadow: 0 0 8px var(--primary-text-color); z-index: 3; }
        .mdr-cell.processed { background-color: var(--border-color); color: #555; cursor: not-allowed; }
        .mdr-cell.processed .mdr-cell-content { transform: scale(0.8); opacity: 0.7; }
        .mdr-selection-overlay { position: absolute; border: 1px dashed var(--primary-text-color); background-color: rgba(100, 255, 218, 0.1); pointer-events: none; z-index: 1; }
        .mdr-bins-area { display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--primary-text-color); }
        .mdr-bin { width: 60px; height: 60px; border: 2px solid var(--secondary-text-color); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 10px; font-weight: bold; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; }
        .mdr-bin:hover { transform: scale(1.05); box-shadow: 0 0 8px currentColor; }
        .mdr-bin-label { font-size: 12px; margin-bottom: 3px; }
        .mdr-bin-count { font-size: 14px; }
        .mdr-bin.woe { border-color: var(--mdr-bin-wo); color: var(--mdr-bin-wo); }
        .mdr-bin.frolic { border-color: var(--mdr-bin-fr); color: var(--mdr-bin-fr); }
        .mdr-bin.dread { border-color: var(--mdr-bin-dr); color: var(--mdr-bin-dr); }
        .mdr-bin.malice { border-color: var(--mdr-bin-ma); color: var(--mdr-bin-ma); }
        .mdr-progress-area { padding: 10px 0 5px 0; text-align: center; font-size: 12px; }
        .mdr-progress-bar-container { width: 80%; height: 15px; background-color: var(--border-color); margin: 5px auto; border: 1px solid var(--primary-text-color); }
        .mdr-progress-bar { width: 0%; height: 100%; background-color: var(--primary-text-color); transition: width 0.3s ease-in-out; }
        .mdr-file-status { margin-top: 5px; font-size: 14px; color: var(--primary-text-color); }
    </style>
</head>
<body>
    <div id="lumon-os-container">
        <div id="desktop">
            <div id="lumon-logo-desktop" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; opacity: 0.1; pointer-events: none;">
                 <svg width="200" height="200" viewBox="0 0 100 100" fill="var(--primary-text-color)">
                    <path d="M20,20 L20,80 L40,80 L40,60 L60,60 L60,80 L80,80 L80,20 L60,20 L60,40 L40,40 L40,20 Z M45,45 L55,45 L55,55 L45,55 Z"/>
                </svg>
                <p style="color: var(--primary-text-color); font-size: 24px; margin-top: 10px;">LUMON INDUSTRIES</p>
                <p style="color: var(--secondary-text-color); font-size: 12px;">MDR Workstation Protocol v3.7</p>
            </div>
        </div>
        <div id="system-access-menu">
            <div class="access-menu-header">SYSTEM FUNCTIONS</div>
            <ul class="access-menu-list" id="system-access-apps-list"></ul>
            <div class="access-menu-footer"> <button id="system-shutdown-button" title="Simulated">SYSTEM HALT</button> </div>
        </div>
        <div id="system-bar">
            <button id="system-access-button">ACCESS</button>
            <div id="active-tasks-bar"></div>
            <div id="system-info-area"> <span>MDR-TERMINAL</span> | <span id="clock">00:00</span> </div>
        </div>
    </div>

<script>
// <![CDATA[
    const desktop = document.getElementById('desktop');
    const activeTasksBar = document.getElementById('active-tasks-bar');
    const systemAccessButton = document.getElementById('system-access-button');
    const systemAccessMenu = document.getElementById('system-access-menu');
    const systemAccessAppsList = document.getElementById('system-access-apps-list');
    const clockElement = document.getElementById('clock');
    let highestZIndex = 100; let openWindows = {}; let activeWindowId = null; let windowIdCounter = 0;
    let audioCtx = null; const EMOTION_FREQUENCIES = { WO: 150, FR: 600, DR: 250, MA: 400 };
    let lastPlayedEmotionSound = null; let soundTimeout = null;

    const ICONS = { DATA_FILE: '🗂️', REFINEMENT_LOG: '📝', COGNITIVE_SORTING: '🧠', PROCEDURAL_MAZE: '🐍', AUDIO_CAPTURE: '🎙️', SYSTEM_SETTINGS: '⚙️', INFO: 'ℹ️', MACRODATA: '🔢' };
    const availableApps = [ { id: 'mdr', name: 'Macrodata Refinement', icon: ICONS.MACRODATA, type: 'desktop_shortcut', launch: () => launchMacrodataRefinement() }, { id: 'fileExplorer', name: 'Data Files', icon: ICONS.DATA_FILE, type: 'start_menu_app', launch: () => createWindow('fileExplorer', 'Data Files', ICONS.DATA_FILE, '<p style="padding:10px; color: var(--secondary-text-color);">Access to refined data sets. (Simulated)</p><p style="padding:10px; color: var(--secondary-text-color);">DRH_BIN_001.dat<br>LEX_FIN_002.dat<br>KTR_OP_003.dat</p>', 400, 300) }, { id: 'terminal', name: 'Refinement Log', icon: ICONS.REFINEMENT_LOG, type: 'start_menu_app', launch: () => { const content = '<textarea class="terminal-textarea" spellcheck="false">LUMON MDR TERMINAL - LOG\n---------------------------\nSESSION_INITIATED\nUSER: MDR_OPERATIVE_#\n\n> ENTER COMMANDS OR NOTES...\n\n</textarea>'; createWindow('terminal', 'Refinement Log', ICONS.REFINEMENT_LOG, content, 500, 350); } }, { id: 'snake', name: 'Procedural Maze', icon: ICONS.PROCEDURAL_MAZE, type: 'start_menu_app', launch: () => launchSnakeGame() }, { id: 'solitaire', name: 'Cognitive Sorting', icon: ICONS.COGNITIVE_SORTING, type: 'start_menu_app', launch: () => launchSolitaireGame() }, { id: 'voiceRecorder', name: 'Audio Capture', icon: ICONS.AUDIO_CAPTURE, type: 'start_menu_app', launch: () => launchVoiceRecorder() }, { id: 'about', name: 'System Information', icon: ICONS.INFO, type: 'start_menu_app', launch: () => createWindow('about', 'System Info', ICONS.INFO, '<div style="padding:20px; color: var(--secondary-text-color); line-height: 1.6;"><h2>LUMON MDR Terminal Emulation</h2><p>Version: 1.0.0 (Simulated)</p><p>Authorized Personnel Only.</p><p>&copy; Lumon Industries. All work product is property of Lumon.</p></div>', 400, 250) } ];

    function updateClock() { const now = new Date(); const hours = String(now.getHours()).padStart(2, '0'); const minutes = String(now.getMinutes()).padStart(2, '0'); clockElement.textContent = `${hours}:${minutes}`; } setInterval(updateClock, 1000); updateClock();
    systemAccessButton.addEventListener('click', (event) => { event.stopPropagation(); systemAccessMenu.classList.toggle('visible'); });
    document.addEventListener('click', (event) => { if (!systemAccessMenu.contains(event.target) && event.target !== systemAccessButton) systemAccessMenu.classList.remove('visible'); });
    function populateStartMenuAndDesktop() { systemAccessAppsList.innerHTML = ''; Array.from(desktop.getElementsByClassName('desktop-icon')).forEach(icon => icon.remove()); availableApps.forEach(app => { if (app.type === 'start_menu_app' || app.type === 'all') { const li = document.createElement('li'); const iconEl = document.createElement('span'); iconEl.className = 'icon-placeholder-small'; iconEl.textContent = app.icon; li.appendChild(iconEl); li.appendChild(document.createTextNode(app.name)); li.addEventListener('click', () => { app.launch(); systemAccessMenu.classList.remove('visible'); }); systemAccessAppsList.appendChild(li); } if (app.type === 'desktop_shortcut' || app.type === 'all') { const div = document.createElement('div'); div.className = 'desktop-icon'; div.title = app.name; const iconEl = document.createElement('span'); iconEl.className = 'icon-placeholder'; iconEl.textContent = app.icon; const nameEl = document.createElement('span'); nameEl.textContent = app.name; div.appendChild(iconEl); div.appendChild(nameEl); div.addEventListener('dblclick', () => app.launch()); desktop.appendChild(div); } }); }
    function createWindow(idSuffix, title, icon, contentHTML, width = 600, height = 400) { const baseId = `window-${idSuffix}`; let uniqueId = baseId; let counter = 0; while (openWindows[uniqueId]) { counter++; uniqueId = `${baseId}-${counter}`; } const windowId = uniqueId; if (openWindows[windowId] && !openWindows[windowId].minimized) { focusWindow(windowId); return openWindows[windowId].element; } if(openWindows[windowId] && openWindows[windowId].minimized){ toggleMinimizeWindow(windowId); return openWindows[windowId].element; } const win = document.createElement('div'); win.className = 'app-window'; win.id = windowId; win.style.width = `${width}px`; win.style.height = `${height}px`; const desktopRect = desktop.getBoundingClientRect(); const taskbarHeight = document.getElementById('system-bar').offsetHeight; let initialX = Math.max(10, Math.random() * (desktopRect.width - width - 20)); let initialY = Math.max(10, Math.random() * (desktopRect.height - height - taskbarHeight - 20)); win.style.left = `${initialX}px`; win.style.top = `${initialY}px`; win.style.zIndex = highestZIndex++; const titleBar = document.createElement('div'); titleBar.className = 'title-bar'; const titleBarIcon = document.createElement('span'); titleBarIcon.className = 'title-bar-icon'; titleBarIcon.textContent = icon; const titleBarText = document.createElement('span'); titleBarText.className = 'title-bar-text'; titleBarText.textContent = title; const controls = document.createElement('div'); controls.className = 'title-bar-controls'; const minimizeButton = document.createElement('button'); minimizeButton.innerHTML = '_'; minimizeButton.title = "Minimize Task"; minimizeButton.onclick = (e) => { e.stopPropagation(); toggleMinimizeWindow(windowId); }; const closeButton = document.createElement('button'); closeButton.innerHTML = 'X'; closeButton.title = "Terminate Task"; closeButton.className = 'close-button'; closeButton.onclick = (e) => { e.stopPropagation(); closeWindow(windowId); }; controls.
